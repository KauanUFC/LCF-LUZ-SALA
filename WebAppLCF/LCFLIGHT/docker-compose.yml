version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: lcf_management
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lcflight_pass}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-lcflight_pass}@postgres:5432/lcf_management
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtts://broker.hivemq.com:8883}
      JWT_SECRET: ${JWT_SECRET:-lcflight-secret-change-me}
      FRONTEND_DIR: /app/frontend
      NODE_ENV: production
    volumes:
      - ./frontend/dist:/app/frontend:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: