; TEST_ESP32_FIRMWARE_LCF
; Multi-room smart lighting firmware for ESP32

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
upload_speed = 115200

board_build.partitions = default_ffat.csv

lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    ayushsharma82/ElegantOTA

build_flags =
    -Os
    -DBOARD_HAS_PSRAM
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1

monitor_filters =
    esp32_exception_decoder

; Test environment: tests logic modules only (no web/wifi/ota/time)
[env:test_esp32]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

board_build.partitions = default_ffat.csv
test_build_src = yes

build_src_filter = +<config/> +<lights/> +<mqtt/> +<inputs/> -<web/> -<wifi/> -<health/> -<ota/> -<time/> -<main.cpp>

lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    throwtheswitch/Unity

build_flags =
    -Os
    -DBOARD_HAS_PSRAM
